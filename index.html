<body data-sport="foot">
  <header class="topbar">
    <div class="brand">
      <svg class="logo" viewBox="0 0 48 48" aria-hidden="true">
        <defs>
          <linearGradient id="lg-ring" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#38d6ff"/><stop offset=".5" stop-color="#ffd21f"/><stop offset="1" stop-color="#ff4f8b"/></linearGradient>
        </defs>
        <path d="M12 9.5l3.2-5.5h3.4l-3.2 5.5z" fill="#38d6ff"/>
        <path d="M22.3 9.5l3.2-5.5h3.4l-3.2 5.5z" fill="#ffd21f"/>
        <path d="M32.6 9.5l3.2-5.5h3.4l-3.2 5.5z" fill="#ff4f8b"/>
        <ellipse cx="24" cy="28" rx="20" ry="12.5" fill="none" stroke="url(#lg-ring)" stroke-width="4.2"/>
        <path d="M3 28h11.5l3.6-8.5 5.2 16 4.4-11.5 2.6 4H45" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span class="wordmark"><span class="w-arena">ARENA</span><span class="w-pulse">360</span></span>
    </div>
    <nav class="sport-switch" role="tablist">
      <button class="sport-btn active" data-sport="foot" role="tab">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 7.2l3.4 2.5-1.3 4h-4.2l-1.3-4z" fill="currentColor"/><path d="M12 7.2V2.6M15.4 9.7l4.3-1.4M14.1 13.7l2.7 3.7M9.9 13.7l-2.7 3.7M8.6 9.7L4.3 8.3" stroke="currentColor" stroke-width="1.5"/></svg>
        Football
      </button>
      <button class="sport-btn" data-sport="velo" role="tab">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5.5" cy="16.5" r="3.8" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="18.5" cy="16.5" r="3.8" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M5.5 16.5l4-7h6l3 7M9.5 9.5l3 7h-7M15.5 9.5l-1.2-3h-2.3" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
        Cyclisme
      </button>
      <button class="sport-btn" data-sport="jeu" role="tab">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="3" width="12" height="17" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.8" transform="rotate(-8 10 11.5)"/><rect x="8" y="4" width="12" height="17" rx="2.5" fill="currentColor" opacity=".9" transform="rotate(8 14 12.5)"/></svg>
        Je parie
      </button>
    </nav>
    <div class="clock" id="clock"></div>
    <a class="admin-btn" id="admin-btn" href="admin.html" hidden aria-label="Statistiques (admin)">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V10m6 10V4m6 16v-7m4 7H2" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
      <span>Admin</span>
    </a>
    <button class="install-btn" id="install-btn" hidden aria-label="Installer l'application">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v11m0 0l-4.5-4.5M12 14l4.5-4.5M5 17v3h14v-3" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>Installer</span>
    </button>
  </header>

  <!-- ============ FOOTBALL ============ -->
  <section id="foot" class="sport-pane">
    <aside class="sidebar" id="foot-sidebar">
      <input class="search" id="league-search" type="search" placeholder="Chercher une compétition…">
      <div id="league-list"></div>
    </aside>
    <main class="main" id="foot-main"></main>
  </section>

  <!-- ============ CYCLISME ============ -->
  <section id="velo" class="sport-pane hidden">
    <main class="main full" id="velo-main"></main>
  </section>

  <!-- ============ JEU ============ -->
  <section id="jeu" class="sport-pane hidden">
    <main class="main full" id="jeu-main"></main>
  </section>

  <button class="menu-fab" id="menu-fab" aria-label="Compétitions">☰</button>
